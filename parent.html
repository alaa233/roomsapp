<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent — view stream</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="page page--parent">
    <main class="panel">
      <h1>Parent viewer</h1>
      <p class="hint">Enter the same room ID as the child, then connect.</p>
      <label class="field">
        <span>Room ID</span>
        <input id="roomId" type="text" autocomplete="off" placeholder="e.g. family-kitchen" />
      </label>
      <div class="actions">
        <button id="btnConnect" type="button">Connect</button>
        <button id="btnDisconnect" type="button" disabled>Disconnect</button>
      </div>
      <p id="status" class="status" role="status"></p>
      <div id="remoteControls" class="remote-controls hidden" aria-label="Child device media">
        <span class="remote-controls__label">Child device</span>
        <div class="remote-controls__row">
          <button id="btnChildMic" type="button" disabled>Microphone on</button>
          <button id="btnChildCam" type="button" disabled>Camera on</button>
        </div>
      </div>
      <video id="remoteVideo" class="preview remote" playsinline autoplay></video>
    </main>
    <script type="module" src="/src/parent.js"></script>
  </body>
</html>
