# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: webrtc-child-monitor
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build:web && cd backend && npm ci && npm run build
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
